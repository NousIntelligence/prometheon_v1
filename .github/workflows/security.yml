name: Security

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]
  schedule:
    - cron: "0 8 * * 1"   # every Monday 08:00 UTC
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (dependency vulnerabilities)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Resolve dependencies
        run: uv sync --group dev

      - name: Run pip-audit against the resolved environment
        # `--strict` is dropped because it makes pip-audit fail on the
        # "distribution marked as editable" warning emitted for the
        # prometheon package itself; the audit still exits non-zero when
        # a real vulnerability is found. `uv run --with` provisions an
        # ephemeral environment so we do not need a separate install step.
        #
        # PYSEC-2022-42969 (py 1.11.0) is ignored as a documented accepted
        # risk: `py` is unmaintained and has no fix version, and it enters
        # the graph only as a transitive dep of `retry` (bittensor's
        # choice). The vuln is a ReDoS in path-handling utilities we do
        # not exercise. Track for removal when bittensor drops the `retry`
        # dependency in a future release.
        run: |
          uv run --with pip-audit pip-audit \
            --skip-editable \
            --ignore-vuln PYSEC-2022-42969

  bandit:
    name: bandit (static analysis)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Run bandit on src/
        # `uv run --with bandit` provisions an ephemeral environment with
        # bandit installed and runs the command inside it. Avoids the
        # "No virtual environment found" error from `uv pip install` in
        # a runner that has no pre-existing .venv.
        run: uv run --with bandit bandit -r src/prometheon -ll -q

  verify-signatures:
    name: verify pushed commits are signed
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # `git log --pretty=%G?` cannot answer this on a runner: verifying an
      # SSH signature needs the signer's public key in an allowed_signers
      # file, which CI has no copy of, so every commit reports "N" and the
      # job failed on every PR regardless of whether it was signed. Ask
      # GitHub instead — it already holds the keys registered on each
      # account, and its verdict is the one shown in the UI.
      - name: Fail on unverified commits in PR range
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          unverified=""
          for sha in $(git rev-list "$BASE..$HEAD"); do
            verdict="$(gh api "repos/$REPO/commits/$sha" \
              --jq '.commit.verification.verified, .commit.verification.reason' | paste -sd' ')"
            echo "$sha $verdict"
            case "$verdict" in
              true*) ;;
              *) unverified="$unverified$sha $verdict"$'\n' ;;
            esac
          done
          if [[ -n "$unverified" ]]; then
            echo "::error::Unverified commits in this PR:"
            printf '%s' "$unverified"
            exit 1
          fi
          echo "Every commit in the PR range is verified by GitHub."
