name: Security

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]
  schedule:
    - cron: "0 8 * * 1"   # every Monday 08:00 UTC
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (dependency vulnerabilities)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.x"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Resolve dependencies
        run: uv sync --group dev

      - name: Run pip-audit against the resolved environment
        # `--strict` is dropped because it makes pip-audit fail on the
        # "distribution marked as editable" warning emitted for the
        # prometheon package itself; the audit still exits non-zero when
        # a real vulnerability is found. `uv run --with` provisions an
        # ephemeral environment so we do not need a separate install step.
        #
        # PYSEC-2022-42969 (py 1.11.0) is ignored as a documented accepted
        # risk: `py` is unmaintained and has no fix version, and it enters
        # the graph only as a transitive dep of `retry` (bittensor's
        # choice). The vuln is a ReDoS in path-handling utilities we do
        # not exercise. Track for removal when bittensor drops the `retry`
        # dependency in a future release.
        run: |
          uv run --with pip-audit pip-audit \
            --skip-editable \
            --ignore-vuln PYSEC-2022-42969

  bandit:
    name: bandit (static analysis)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.x"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Run bandit on src/
        # `uv run --with bandit` provisions an ephemeral environment with
        # bandit installed and runs the command inside it. Avoids the
        # "No virtual environment found" error from `uv pip install` in
        # a runner that has no pre-existing .venv.
        run: uv run --with bandit bandit -r src/prometheon -ll -q

  verify-signatures:
    name: verify pushed commits are signed
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail on unsigned commits in PR range
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          unsigned="$(git log --pretty='%H %G?' "$base..$head" | awk '$2!="G" && $2!="U" {print $1}')"
          if [[ -n "$unsigned" ]]; then
            echo "::error::The following commits are unsigned or have an invalid signature:"
            echo "$unsigned"
            exit 1
          fi
          echo "All commits in the PR range carry valid signatures."
