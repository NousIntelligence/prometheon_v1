[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "prometheon"
version = "0.1.0"
description = "Bittensor subnet that converts BitFan platform-qualified user activity into deterministic on-chain weights."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.15"
keywords = [
    "bittensor",
    "subnet",
    "prometheon",
    "bitfan",
    "growth-incentive",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Distributed Computing",
]

authors = [
    { name = "AisA-wdym" },
    { name = "dongTigerLU" },
    { name = "yuukiakito" },
]

maintainers = [
    { name = "AisA-wdym" },
]

# Runtime dependencies. Versions follow the binding pins documented in the
# internal specification: bittensor and rfc8785 are pinned exactly because their
# wire and canonicalization behaviour is part of the cross-implementation
# contract; everything else uses conservative compatible ranges.
dependencies = [
    "bittensor==10.3.2",
    "rfc8785==0.1.4",
    "cryptography>=42,<46",
    "pydantic>=2.6,<3",
    "httpx>=0.27,<1",
    "click>=8.1,<9",
    "structlog>=24,<26",
    "tomli>=2.0,<3 ; python_version < '3.11'",
]

[project.urls]
Repository = "https://github.com/NousIntelligence/prometheon_v1"
Issues = "https://github.com/NousIntelligence/prometheon_v1/issues"

[project.scripts]
prometheon = "prometheon.cli.main:main"

# ---------------------------------------------------------------------------
# Development dependency group (consumed by `uv sync --group dev`).
# ---------------------------------------------------------------------------
[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "pytest-asyncio>=0.23,<2",
    "ruff>=0.6,<1",
    "mypy>=1.10,<2",
    "types-requests>=2",
    "hypothesis>=6,<7",
]

# ---------------------------------------------------------------------------
# Hatch build configuration: src/ layout.
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/prometheon"]

[tool.hatch.build.targets.sdist]
include = [
    "src/prometheon",
    "neurons",
    "configs/*.example.toml",
    "docs",
    "tests",
    "LICENSE",
    "README.md",
    "SECURITY.md",
    "CONTRIBUTING.md",
]

# ---------------------------------------------------------------------------
# Ruff: linting and formatting.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "neurons"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "S",    # flake8-bandit
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "N",    # pep8-naming
]
ignore = [
    "E501",   # line too long (formatter handles it)
    "S101",   # assert is allowed in tests
    "S603",   # subprocess call - reviewed case by case
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"neurons/*.py" = ["S603"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# Mypy: strict type-checking on the src/ tree.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_unimported = true
files = ["src/prometheon"]

[[tool.mypy.overrides]]
module = ["bittensor.*", "bittensor_wallet.*", "substrateinterface.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest configuration.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
markers = [
    "unit: fast, isolated unit tests",
    "contract: cross-implementation contract tests using shared fixtures",
    "integration: integration tests against mock platform and mock chain",
    "localnet: tests requiring a running Bittensor localnet",
    "slow: tests with non-trivial runtime",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:bittensor.*",
]

[tool.coverage.run]
source = ["src/prometheon"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
skip_covered = false
